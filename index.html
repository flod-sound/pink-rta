<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flo.D RTA">
<meta name="theme-color" content="#070809">
<title>Flo.D Pink RTA</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Flo.D: 블랙 & 연노랑. 한 손 조작, 큰 숫자, 아래쪽에 주요 버튼 */
:root{
  --bg:#070809;--panel:#101215;--panel2:#1b1e24;--line:#2c3038;
  --text:#f2f2f0;--dim:#8b9099;--y:#ffe98a;--y2:#7a6f42;
  --hi:#ff9a1f;--lo:#5fd4ff;--ok:#3ee08f;
  --s1:#5fd4ff;--s2:#ff6b9a;--s3:#c590f0;--s4:#3ee08f;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sans:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;width:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-user-select:none;user-select:none;overflow:hidden}
body{display:flex;flex-direction:column;gap:10px;
  padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 머리 */
header{display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;display:block}
.logo{font-family:var(--mono);font-weight:700;font-size:19px;color:var(--y);line-height:1.1}
.logo i{font-style:normal;color:var(--text)}
.app{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim)}
.grow{flex:1}
.pill{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em}
.pill b{width:7px;height:7px;border-radius:50%;background:var(--line)}
.pill.live{color:var(--y)} .pill.live b{background:var(--y);box-shadow:0 0 8px var(--y)}
.gear{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--dim);border:1px solid var(--line)}
.gear svg{width:18px;height:18px}

/* 레벨 카드 */
.level{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:end}
.big{font-family:var(--mono);font-weight:700;font-size:58px;line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big small{font-size:13px;font-weight:500;letter-spacing:0;color:var(--dim);margin-left:4px}
.wchip{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--bg);background:var(--y);border-radius:5px;padding:2px 5px;margin-left:4px;vertical-align:4px;letter-spacing:0}
.verdict{text-align:right;font-weight:700;font-size:15px;line-height:1.25}
.verdict span{display:block;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--dim);letter-spacing:.08em}
.v-ok{color:var(--y)} .v-up{color:var(--lo)} .v-down{color:var(--hi)}
.gauge{grid-column:1/-1;position:relative;height:26px;margin-top:8px}
.track{position:absolute;inset:6px 0 auto;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:var(--y2)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--dim);transition:width .12s linear}
.tmark{position:absolute;top:1px;width:2px;height:18px;background:var(--y);transform:translateX(-1px)}
.ticks{position:absolute;left:0;right:0;top:17px;font-family:var(--mono);font-size:9px;color:var(--dim)}
.ticks span{position:absolute;transform:translateX(-50%)}
.calnote{grid-column:1/-1;font-size:11px;color:var(--hi);display:flex;gap:6px;align-items:center}
.calnote button{color:var(--hi);text-decoration:underline;font-size:11px;padding:0}

/* 메인 패널 */
.main{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);padding:4px;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{padding:9px 0;border-radius:10px;font-size:14px;font-weight:700;color:var(--dim)}
.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--y)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tools{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 12px;border-radius:10px;background:var(--panel2);font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg)}
.chip.acc{background:var(--y);color:var(--bg)}
.chip small{font-weight:500;color:var(--dim);margin-right:4px}
.chip.on small,.chip.acc small{color:inherit;opacity:.6}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;color:var(--dim);font-size:14px;line-height:1.7;background:var(--panel)}
.overlay b{color:var(--text)}
.steps{display:grid;gap:10px;text-align:left;max-width:290px}
.steps div{display:flex;gap:10px;align-items:flex-start}
.steps em{font-style:normal;font-family:var(--mono);font-weight:700;color:var(--bg);background:var(--y);border-radius:6px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;margin-top:2px}

/* 레벨 탭 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stats div{background:var(--panel);padding:10px 12px}
.stats label{display:block;font-size:10px;color:var(--dim);letter-spacing:.06em;margin-bottom:2px}
.stats output{font-family:var(--mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}

/* 기록 탭 */
.list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:10px 12px}
.item .sw{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-size:14px}
.item .nm span{font-family:var(--mono);font-size:11px;color:var(--dim)}
.item .tg{padding:7px 10px;border-radius:8px;font-size:12px;font-weight:700;background:var(--panel);color:var(--dim)}
.item .tg.on{background:var(--text);color:var(--bg)}
.item .del{padding:7px 8px;color:var(--dim);font-size:12px}
.empty{color:var(--dim);text-align:center;padding:30px 20px;font-size:14px;line-height:1.7}

/* 아래 큰 버튼 */
#go{width:100%;padding:16px 0;border-radius:14px;background:var(--y);color:#0b0b0b;font-size:17px;font-weight:800;letter-spacing:.02em}
#go.stop{background:var(--panel2);color:var(--y);box-shadow:inset 0 0 0 1px var(--y2)}
#go:active,.chip:active{transform:scale(.97)}
.foot{font-family:var(--mono);font-size:9px;color:var(--dim);text-align:center;margin-top:-4px}

/* 설정 시트 */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:20}
.sheet .box{width:100%;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:17px}
.row{display:flex;align-items:center;gap:12px}
.row .lb{flex:1}
.row .lb b{display:block;font-size:15px}
.row .lb span{font-size:12px;color:var(--dim);line-height:1.5}
.step{display:flex;align-items:center;background:var(--panel2);border-radius:12px}
.step button{width:44px;height:44px;font-size:22px;color:var(--y);font-family:var(--mono)}
.step output{min-width:56px;text-align:center;font-family:var(--mono);font-weight:700;font-size:18px}
.sheet .close{padding:14px;border-radius:12px;background:var(--y);color:#0b0b0b;font-weight:800;font-size:16px}
.note{font-size:12px;color:var(--dim);line-height:1.6;background:var(--panel2);border-radius:10px;padding:10px 12px}
@media (max-height:720px){.big{font-size:46px}.tabs button{padding:7px 0}}

/* EQ 탭 */
.eqv{flex:1;min-height:0;display:flex;flex-direction:column}
.eqg{position:relative;height:36%;min-height:120px;border-bottom:1px solid var(--line);flex:0 0 auto}
.eql{flex:1;min-height:0;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;-webkit-user-select:text;user-select:text}
.eqc{background:var(--panel2);border-radius:12px;padding:10px 12px}
.eqc h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eqc h3 em{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--y);color:var(--bg)}
.eqc h3 span{font-weight:500;font-size:11px;color:var(--dim)}
.peq{width:100%;border-collapse:collapse;font-family:var(--mono);font-variant-numeric:tabular-nums}
.peq th{font-size:10px;color:var(--dim);font-weight:500;text-align:right;padding:2px 6px;letter-spacing:.08em}
.peq td{font-size:18px;font-weight:700;text-align:right;padding:6px;border-top:1px solid var(--line);white-space:nowrap}
.peq td:first-child,.peq th:first-child{text-align:left;color:var(--dim);font-size:12px;width:22px;padding-left:0}
.peq td small{display:block;font-size:9px;color:var(--dim);font-weight:500}
.cut{color:var(--lo)} .boost{color:var(--hi)}
.peq tr.off td{color:var(--dim);font-weight:500;font-size:12px}
.geq{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.geq div{background:var(--panel);border-radius:8px;padding:7px 9px;display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700}
.geq div span{color:var(--dim);font-weight:500;font-size:12px}
.eqnote{font-size:12px;color:var(--dim);line-height:1.65;padding:4px 4px 8px}
.eqnote b{color:var(--text)}
/* EQ 설정 */
.sheet .box{max-height:92vh;overflow-y:auto}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts .chip.on{background:var(--y);color:var(--bg)}
.tgl{width:52px;height:30px;border-radius:15px;background:var(--panel2);position:relative;flex:0 0 auto;box-shadow:inset 0 0 0 1px var(--line)}
.tgl::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--dim);transition:left .15s}
.tgl.on{background:var(--y)} .tgl.on::after{left:25px;background:var(--bg)}
.row.sub{padding-left:14px;margin-top:-8px}
.row.dis{opacity:.35;pointer-events:none}

/* 가로 화면 */
@media (orientation:landscape) and (max-height:560px){
  body{display:grid;grid-template-columns:minmax(220px,30%) 1fr;grid-template-rows:auto auto 1fr auto auto;gap:8px 12px}
  header{grid-column:1;grid-row:1}
  .level{grid-column:1;grid-row:2;padding:10px 12px}
  .main{grid-column:2;grid-row:1/6}
  #go{grid-column:1;grid-row:4;padding:13px 0}
  .foot{grid-column:1;grid-row:5;margin:0}
  .big{font-size:40px}
  .verdict{font-size:13px}
  .eqv{flex-direction:row}
  .eqg{height:auto;width:44%;border-bottom:0;border-right:1px solid var(--line)}
  .sheet{align-items:center;justify-content:center}
  .sheet .box{max-width:560px;border-radius:18px;border:1px solid var(--line)}
}
</style>
</head>
<body>
<header>
  <img class="mark" src="logo.svg" alt="">
  <div><div class="logo">Flo<i>.</i>D</div><div class="app">PINK RTA</div></div>
  <div class="grow"></div>
  <div class="pill" id="pill"><b></b><span id="pillTxt">대기</span></div>
  <button class="gear" id="openSet" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</header>

<section class="level">
  <div class="big" id="big">--<small>dB</small><span class="wchip" id="wchip">A</span></div>
  <div class="verdict" id="verdict"><span>목표 95 dB</span>시작을 누르세요</div>
  <div class="gauge"><div class="track"><div class="zone" id="zone"></div><div class="fill" id="fill"></div></div><div class="tmark" id="tmark"></div><div class="ticks" id="ticks"></div></div>
  <div class="calnote" id="calnote">보정 전이라 dB는 대략값이에요. <button id="calLink">보정하기</button></div>
</section>

<section class="main">
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="rta">RTA</button>
    <button role="tab" aria-selected="false" data-tab="eq">EQ</button>
    <button role="tab" aria-selected="false" data-tab="lvl">레벨</button>
    <button role="tab" aria-selected="false" data-tab="rec">기록 <span id="recN" class="mono" style="font-size:11px"></span></button>
  </div>

  <div class="view" id="v-rta">
    <div class="stage"><canvas id="cv"></canvas>
      <div class="overlay" id="intro">
        <div class="steps">
          <div><em>1</em><span>콘솔에서 <b>핑크노이즈</b>를 내보내요</span></div>
          <div><em>2</em><span>폰 <b>아래쪽 마이크</b>를 스피커 쪽으로 향해요</span></div>
          <div><em>3</em><span>아래 <b>측정 시작</b>을 눌러요</span></div>
          <div><em>4</em><span><b>흰 선</b>이 점선과 나란해지게 EQ를 만져요</span></div>
        </div>
      </div>
    </div>
    <div class="tools">
      <button class="chip acc" id="snap">＋ 저장</button>
      <button class="chip" id="avgB"><small>평균</small>5초</button>
      <button class="chip" id="resB"><small>해상도</small>1/3</button>
      <button class="chip" id="peakB">피크</button>
      <button class="chip" id="frzB">고정</button>
      <button class="chip" id="rstB">초기화</button>
    </div>
  </div>

  <div class="view" id="v-eq" hidden>
    <div class="eqv">
      <div class="eqg"><canvas id="cv3"></canvas></div>
      <div class="eql" id="eqList"></div>
    </div>
    <div class="tools">
      <button class="chip acc" id="eqCon"><small>콘솔</small>TF</button>
      <button class="chip" id="eqLock">값 고정</button>
      <button class="chip" id="eqCurve"><small>목표</small>평탄</button>
      <button class="chip" id="eqAgain">다시 계산</button>
    </div>
  </div>

  <div class="view" id="v-lvl" hidden>
    <div class="stats">
      <div><label>평균 Leq</label><output id="leq">--</output></div>
      <div><label>최대</label><output id="lmax">--</output></div>
      <div><label>최소</label><output id="lmin">--</output></div>
    </div>
    <div class="stage"><canvas id="cv2"></canvas></div>
    <div class="tools">
      <button class="chip" data-w="A"><small>가중치</small>A</button>
      <button class="chip" data-w="C">C</button>
      <button class="chip" data-w="Z">Z</button>
      <button class="chip" id="lrst">초기화</button>
    </div>
  </div>

  <div class="view" id="v-rec" hidden>
    <div class="list" id="list"></div>
  </div>
</section>

<button id="go">측정 시작</button>
<div class="foot" id="dbg">v10</div>

<div class="sheet" id="sheet" hidden>
  <div class="box">
    <h2>설정</h2>
    <div class="row"><div class="lb"><b>목표 레벨</b><span>핑크노이즈를 이 크기에 맞춰요</span></div>
      <div class="step"><button id="tDn">−</button><output id="tVal">95</output><button id="tUp">+</button></div></div>
    <div class="row"><div class="lb"><b>보정</b><span>소음계와 나란히 두고 숫자가 같아질 때까지 눌러요</span></div>
      <div class="step"><button id="cDn">−</button><output id="cVal">+120</output><button id="cUp">+</button></div></div>
    <div class="note">아이폰 마이크는 사파리에서 <b>125Hz 아래</b>를 약하게 받아요. 그 대역은 흐리게 보이고 기준 계산에서도 빠져요.</div>
    <button class="close" id="closeSet">완료</button>
  </div>
</div>

<div class="sheet" id="eqSheet" hidden>
  <div class="box">
    <h2>콘솔 · 쓸 수 있는 EQ</h2>
    <div class="opts" id="conPick"></div>
    <div id="eqRows"></div>
    <div class="note" id="conNote"></div>
    <button class="close" id="eqClose">완료</button>
  </div>
</div>

<script>
const VER="v10";
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL={y:css('--y'),y2:css('--y2'),hi:css('--hi'),lo:css('--lo'),dim:css('--dim'),line:css('--line'),text:css('--text')};
const SNAPCOL=[css('--s1'),css('--s2'),css('--s3'),css('--s4')];
const FMIN=28,FMAX=18000,GMIN=70,GMAX=110,TOL=2;

let target=store.get('target',95),cal=store.get('cal',120),calSet=store.get('calSet',false);
let tau=store.get('tau',5),res=store.get('res',3),wgt=store.get('wgt','A'),peakOn=false,frozen=false;
let snaps=store.get('snaps',[]);

// 밴드 (1/3 또는 1/6 옥타브)
function makeBands(n){const out=[];for(let k=Math.round(n*Math.log2(31.5/1000));;k++){const c=1000*2**(k/n);if(c>16500)break;out.push(c)}return out}
// A/C 가중치 (dB)
function wA(f){const f2=f*f,r=(12194**2*f2*f2)/((f2+20.6**2)*Math.sqrt((f2+107.7**2)*(f2+737.9**2))*(f2+12194**2));return 20*Math.log10(r)+2.0}
function wC(f){const f2=f*f,r=(12194**2*f2)/((f2+20.6**2)*(f2+12194**2));return 20*Math.log10(r)+0.06}
const W=f=>wgt==='A'?wA(f):wgt==='C'?wC(f):0;

let ctx=null,an,src,mute,stream,buf,bins,bands,wakeL=null,running=false,lastT=0,lastDbg=0;
let rt=null,avg=null,peak=null,fastLvl=null,yTop=null;
let lvlHist=[],leqSum=0,leqN=0,lmax=-Infinity,lmin=Infinity,lastHist=0,procTxt='';

function setupBands(){
  bands=makeBands(res);
  rt=avg=peak=null;
  if(!ctx)return;
  const f=ctx.sampleRate/an.fftSize,h=2**(1/(2*res));
  bins=bands.map(c=>{const lo=Math.max(1,Math.round(c/h/f)),hi=Math.max(lo,Math.round(c*h/f)-1);return[lo,hi]});
}
bands=makeBands(res);

async function start(){
  try{
    // iOS: 누른 순간 오디오를 만들고 깨움
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const r=ctx.resume();
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
    await Promise.race([r,new Promise(x=>setTimeout(x,800))]);
    if(ctx.state!=='running')ctx.resume();
    try{const s=stream.getAudioTracks()[0].getSettings();procTxt=(s.echoCancellation||s.noiseSuppression||s.autoGainControl)?'음성처리 켜짐':'음성처리 꺼짐'}catch(_){procTxt=''}
    an=ctx.createAnalyser();an.fftSize=16384;an.smoothingTimeConstant=0;an.minDecibels=-140;an.maxDecibels=0;
    src=ctx.createMediaStreamSource(stream);src.connect(an);
    // 사파리는 출력에 연결된 노드만 계산 → 무음으로 연결
    mute=ctx.createGain();mute.gain.value=0;an.connect(mute);mute.connect(ctx.destination);
    buf=new Float32Array(an.frequencyBinCount);
    setupBands();
    running=true;$('intro').hidden=true;
    $('go').textContent='측정 정지';$('go').classList.add('stop');
    $('pill').classList.add('live');$('pillTxt').textContent='측정 중';
    try{wakeL=await navigator.wakeLock.request('screen')}catch(e){}
    lastT=performance.now();requestAnimationFrame(loop);
  }catch(e){
    if(ctx){try{ctx.close()}catch(_){}}ctx=null;
    $('intro').hidden=false;
    $('intro').innerHTML='<div><b>마이크를 쓸 수 없어요.</b><br>설정 → 앱 → Safari → 마이크를<br>"허용"으로 바꾸고 새로고침하세요.</div><div class="mono" style="font-size:11px">'+e.name+'</div>';
  }
}
function stop(){
  running=false;
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(ctx){ctx.close();ctx=null}
  $('go').textContent='측정 시작';$('go').classList.remove('stop');
  $('pill').classList.remove('live');$('pillTxt').textContent='대기';
  if(wakeL){wakeL.release().catch(()=>{});wakeL=null}
}

const ema=(arr,p,a)=>arr?arr.map((v,i)=>v+(p[i]-v)*a):p.slice();
function loop(t){
  if(!running)return;
  const dt=Math.min(.2,(t-lastT)/1000);lastT=t;
  if(!frozen){
    an.getFloatFrequencyData(buf);
    if(!isFinite(buf[200])){
      $('pillTxt').textContent=ctx.state!=='running'?'화면을 눌러주세요':'신호 없음';
      draw();requestAnimationFrame(loop);return;
    }
    $('pillTxt').textContent='측정 중';
    const p=bins.map(([lo,hi])=>{let s=0;for(let i=lo;i<=hi;i++)s+=10**(buf[i]/10);return s});
    rt=ema(rt,p,1-Math.exp(-dt/0.2));
    avg=ema(avg,p,1-Math.exp(-dt/tau));
    peak=peak?peak.map((v,i)=>Math.max(v,rt[i])):rt.slice();
    let s=0;p.forEach((v,i)=>{s+=v*10**(W(bands[i])/10)});
    fastLvl=fastLvl===null?s:fastLvl+(s-fastLvl)*(1-Math.exp(-dt/0.5));
    const L=10*Math.log10(fastLvl+1e-20)+cal;
    showLevel(L);
    if(t-lastHist>250){lastHist=t;lvlHist.push(L);if(lvlHist.length>240)lvlHist.shift();
      leqSum+=10**(L/10);leqN++;lmax=Math.max(lmax,L);lmin=Math.min(lmin,L);showStats()}
    if(tab==='eq'&&!eqLock&&t-lastEq>1200){lastEq=t;runEQ()}
    if(t-lastDbg>1000){lastDbg=t;$('dbg').textContent=VER+' · '+ctx.sampleRate+'Hz · '+procTxt}
  }
  draw();
  requestAnimationFrame(loop);
}

// 레벨 표시
const pct=v=>Math.max(0,Math.min(100,(v-GMIN)/(GMAX-GMIN)*100));
let lastTxt=0;
function paintStatic(){
  $('tVal').textContent=target;$('cVal').textContent=(cal>=0?'+':'')+cal;
  $('tmark').style.left=pct(target)+'%';
  $('zone').style.left=pct(target-TOL)+'%';$('zone').style.width=(pct(target+TOL)-pct(target-TOL))+'%';
  $('ticks').innerHTML=[70,80,90,100,110].map(v=>`<span style="left:${pct(v)}%">${v}</span>`).join('');
  $('calnote').hidden=calSet;$('wchip').textContent=wgt;
  document.querySelectorAll('[data-w]').forEach(b=>b.classList.toggle('on',b.dataset.w===wgt));
  $('avgB').innerHTML='<small>평균</small>'+tau+'초';
  $('resB').innerHTML='<small>해상도</small>1/'+res;
  $('peakB').classList.toggle('on',peakOn);
  $('frzB').classList.toggle('on',frozen);$('frzB').textContent=frozen?'고정 풀기':'고정';
  $('recN').textContent=snaps.length?snaps.length:'';
  if(!running)$('verdict').innerHTML=`<span>목표 ${target} dB</span>시작을 누르세요`;
}
function showLevel(L){
  const d=L-target;
  $('fill').style.width=pct(L)+'%';
  $('fill').style.background=Math.abs(d)<=TOL?COL.y:d>0?COL.hi:COL.lo;
  const now=performance.now();if(now-lastTxt<250)return;lastTxt=now;
  $('big').firstChild.nodeValue=Math.round(L);
  const v=$('verdict');
  if(Math.abs(d)<=TOL){v.className='verdict v-ok';v.innerHTML=`<span>목표 ${target} dB</span>딱 좋아요`}
  else if(d<0){v.className='verdict v-up';v.innerHTML=`<span>목표 ${target} dB</span>${Math.round(-d)} dB 올리세요`}
  else{v.className='verdict v-down';v.innerHTML=`<span>목표 ${target} dB</span>${Math.round(d)} dB 내리세요`}
}
function showStats(){
  $('leq').textContent=leqN?(10*Math.log10(leqSum/leqN)).toFixed(1):'--';
  $('lmax').textContent=isFinite(lmax)?lmax.toFixed(1):'--';
  $('lmin').textContent=isFinite(lmin)?lmin.toFixed(1):'--';
}

const cv=$('cv'),g=cv.getContext('2d'),cv2=$('cv2'),g2=cv2.getContext('2d');
function fit(c,cx){const d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(c.width!==w*d||c.height!==h*d){c.width=w*d;c.height=h*d}cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,w,h);return[w,h]}
const LBL=[[31.5,'31'],[63,'63'],[125,'125'],[250,'250'],[500,'500'],[1000,'1k'],[2000,'2k'],[4000,'4k'],[8000,'8k'],[16000,'16k']];
const toDb=a=>a.map(v=>10*Math.log10(v+1e-20)+cal);
let tab='rta';
function draw(){if(tab==='rta')drawRTA();else if(tab==='lvl')drawLvl();else if(tab==='eq')drawEQ()}

function drawRTA(){
  const [Wd,H]=fit(cv,g);
  const top=26,bot=22,L=32,R=8,h=H-top-bot,w=Wd-L-R;
  const X=f=>L+Math.log2(f/FMIN)/Math.log2(FMAX/FMIN)*w;
  const A=avg?toDb(avg):null,Rt=rt?toDb(rt):null,P=peak?toDb(peak):null;
  const shown=snaps.filter(s=>s.show);
  let mx=-Infinity;[A,Rt,peakOn?P:null].forEach(a=>a&&a.forEach(v=>mx=Math.max(mx,v)));shown.forEach(s=>s.db.forEach(v=>mx=Math.max(mx,v)));
  if(!isFinite(mx))mx=86;
  const want=Math.ceil((mx+4)/10)*10;if(yTop===null||want>yTop||want<yTop-10)yTop=want;
  const span=60,yB=yTop-span,Y=v=>top+(1-(Math.max(yB,Math.min(yTop,v))-yB)/span)*h;
  g.font='500 10px "JetBrains Mono",Menlo,monospace';g.textBaseline='middle';g.textAlign='right';g.lineWidth=1;
  for(let v=yB;v<=yTop;v+=10){const y=Math.round(Y(v))+.5;g.strokeStyle=COL.line;g.beginPath();g.moveTo(L,y);g.lineTo(Wd-R,y);g.stroke();g.fillStyle=COL.dim;g.fillText(v,L-5,y)}
  g.textAlign='center';g.textBaseline='top';
  LBL.forEach(([f,t])=>{const x=Math.round(X(f))+.5;g.fillStyle=COL.dim;g.fillText(t,x,H-bot+6);g.strokeStyle=COL.line;g.globalAlpha=.45;g.beginPath();g.moveTo(x,top);g.lineTo(x,top+h);g.stroke();g.globalAlpha=1});
  const hb=2**(1/(2*res));
  // 실시간 막대
  if(Rt)bands.forEach((c,i)=>{const x0=X(c/hb),x1=X(c*hb),gap=Math.max(1,(x1-x0)*.16),y=Y(Rt[i]);
    g.globalAlpha=c<120?.28:.85;g.fillStyle=COL.y;g.fillRect(x0+gap/2,y,x1-x0-gap,top+h-y)});
  g.globalAlpha=1;
  // 피크
  if(peakOn&&P){g.fillStyle=COL.hi;bands.forEach((c,i)=>{const x0=X(c/hb),x1=X(c*hb),y=Y(P[i]);g.fillRect(x0+1,y-1,x1-x0-2,2)})}
  // 저장한 선
  shown.forEach(s=>{g.strokeStyle=s.col;g.lineWidth=2;g.lineJoin='round';g.beginPath();s.f.forEach((f,i)=>{const x=X(f),y=Y(s.db[i]);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()});
  if(A){
    const idx=bands.map((c,i)=>i).filter(i=>bands[i]>=120&&bands[i]<=10500);
    const ref=idx.reduce((s,i)=>s+A[i],0)/idx.length,yr=Y(ref);
    g.setLineDash([5,4]);g.strokeStyle=COL.text;g.globalAlpha=.5;g.lineWidth=1;g.beginPath();g.moveTo(L,yr);g.lineTo(Wd-R,yr);g.stroke();g.setLineDash([]);g.globalAlpha=1;
    g.strokeStyle=COL.text;g.lineWidth=2.5;g.lineJoin='round';g.beginPath();
    bands.forEach((c,i)=>{const x=X(c),y=Y(A[i]);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();
  }
  // 범례
  g.font='600 10px "JetBrains Mono",Menlo,monospace';g.textAlign='left';g.textBaseline='middle';
  let lx=L+4;const ly=12;
  const leg=(c,t,line)=>{g.fillStyle=c;line?g.fillRect(lx,ly-1,12,2.5):g.fillRect(lx,ly-4,8,8);lx+=line?16:12;g.fillStyle=COL.dim;g.fillText(t,lx,ly);lx+=g.measureText(t).width+12};
  leg(COL.y,'실시간');leg(COL.text,'평균',1);if(peakOn)leg(COL.hi,'피크',1);
  shown.forEach(s=>leg(s.col,s.name,1));
  if(frozen){g.fillStyle=COL.hi;g.textAlign='right';g.fillText('■ 고정됨',Wd-R-2,ly)}
}
function drawLvl(){
  const [Wd,H]=fit(cv2,g2);
  const top=14,bot=20,L=32,R=8,h=H-top-bot,w=Wd-L-R;
  const yB=Math.floor(Math.min(target-25,...lvlHist)/10)*10,yT=Math.ceil(Math.max(target+15,...lvlHist)/10)*10,Y=v=>top+(1-(v-yB)/(yT-yB))*h;
  g2.font='500 10px "JetBrains Mono",Menlo,monospace';g2.textAlign='right';g2.textBaseline='middle';g2.lineWidth=1;
  for(let v=yB;v<=yT;v+=10){const y=Math.round(Y(v))+.5;g2.strokeStyle=COL.line;g2.beginPath();g2.moveTo(L,y);g2.lineTo(Wd-R,y);g2.stroke();g2.fillStyle=COL.dim;g2.fillText(v,L-5,y)}
  g2.fillStyle=COL.y2;g2.globalAlpha=.45;g2.fillRect(L,Y(target+TOL),w,Y(target-TOL)-Y(target+TOL));g2.globalAlpha=1;
  g2.strokeStyle=COL.y;g2.setLineDash([5,4]);g2.beginPath();g2.moveTo(L,Y(target));g2.lineTo(Wd-R,Y(target));g2.stroke();g2.setLineDash([]);
  g2.textBaseline='top';g2.fillStyle=COL.dim;
  ['-60초','-45','-30','-15','지금'].forEach((t,i)=>{g2.textAlign=i===0?'left':i===4?'right':'center';g2.fillText(t,L+w*i/4,H-bot+5)});
  if(lvlHist.length>1){
    const n=240,x=i=>L+w*(i+(n-lvlHist.length))/(n-1);
    const path=()=>{g2.beginPath();lvlHist.forEach((v,i)=>{i?g2.lineTo(x(i),Y(v)):g2.moveTo(x(i),Y(v))})};
    path();g2.lineTo(x(lvlHist.length-1),top+h);g2.lineTo(x(0),top+h);g2.closePath();
    const gr=g2.createLinearGradient(0,top,0,top+h);gr.addColorStop(0,'rgba(255,233,138,.28)');gr.addColorStop(1,'rgba(255,233,138,0)');g2.fillStyle=gr;g2.fill();
    path();g2.strokeStyle=COL.y;g2.lineWidth=2;g2.lineJoin='round';g2.stroke();
    g2.fillStyle=COL.y;g2.beginPath();g2.arc(x(lvlHist.length-1),Y(lvlHist[lvlHist.length-1]),4,0,7);g2.fill();
  }else{g2.textAlign='center';g2.textBaseline='middle';g2.fillStyle=COL.dim;g2.font='13px -apple-system,sans-serif';g2.fillText('측정을 시작하면 최근 60초 레벨이 그려져요',L+w/2,top+h/2)}
}

let eqc=Object.assign({con:'tf',main:true,mainN:4,mtx:true,mtxN:4,geq:true,geqMax:15,boost:3,curve:'flat',lo:125},store.get('eqc',{}));
let eqLock=false,lastEq=0,eqRes=null;
const saveEqc=()=>store.set('eqc',eqc);
const FS=48000,GF=[];for(let k=0;;k++){const f=20*2**(k/24);if(f>20000)break;GF.push(f)}
const CW=GF.map(f=>Math.cos(2*Math.PI*f/FS)),SW=GF.map(f=>Math.sin(2*Math.PI*f/FS)),C2=GF.map(f=>Math.cos(4*Math.PI*f/FS)),S2=GF.map(f=>Math.sin(4*Math.PI*f/FS));
const ISO=[20,25,31.5,40,50,63,80,100,125,160,200,250,315,400,500,630,800,1000,1250,1600,2000,2500,3150,4000,5000,6300,8000,10000,12500,16000,20000];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r05=v=>Math.round(v*2)/2;
// 피킹 EQ 응답 (dB) — 격자 전체
function peqResp(f0,g,Q){
  const out=new Float64Array(GF.length);if(!g)return out;
  const A=10**(g/40),w0=2*Math.PI*f0/FS,al=Math.sin(w0)/(2*Q),c=Math.cos(w0);
  const b0=1+al*A,b1=-2*c,b2=1-al*A,a0=1+al/A,a1=b1,a2=1-al/A;
  for(let i=0;i<GF.length;i++){
    const nr=b0+b1*CW[i]+b2*C2[i],ni=-(b1*SW[i]+b2*S2[i]),dr=a0+a1*CW[i]+a2*C2[i],di=-(a1*SW[i]+a2*S2[i]);
    out[i]=10*Math.log10((nr*nr+ni*ni)/(dr*dr+di*di))}
  return out}
const gi=f=>clamp(Math.round(24*Math.log2(f/20)),0,GF.length-1);
const at=(arr,f)=>{const x=24*Math.log2(f/20),i=clamp(Math.floor(x),0,GF.length-2),t=clamp(x-i,0,1);return arr[i]*(1-t)+arr[i+1]*t};
function roundF(f){return f<100?Math.round(f):f<1000?Math.round(f/5)*5:f<10000?Math.round(f/50)*50:Math.round(f/100)*100}
const fTxt=f=>f>=1000?(+(f/1000).toFixed(f>=10000?1:2)).toString()+'k':String(Math.round(f));
const octOf=q=>2/Math.LN2*Math.asinh(1/(2*q));
function curveT(f){
  if(eqc.curve==='flat')return 0;
  // 하우스 커브: 200Hz 아래 최대 +4dB, 4k 위로 −3dB까지 완만히
  const lo=clamp(Math.log2(200/f)/Math.log2(200/50),0,1),hi=clamp(Math.log2(f/4000)/2,0,1);
  return 4*lo-3*hi}
function wsum(r,w){let s=0;for(let i=0;i<r.length;i++)s+=w[i]*r[i]*r[i];return s}

function fitPEQ(r,n,qlo,qhi,gLim,boost,w){
  const QS=[.3,.4,.5,.7,1,1.4,2,2.8,4,5.6,8].filter(q=>q>=qlo-1e-9&&q<=qhi+1e-9);if(!QS.length)QS.push(clamp(1,qlo,qhi));
  const bands=[];
  const tryB=(r,f0,g,q)=>{const p=peqResp(f0,g,q);let s=0;for(let i=0;i<r.length;i++){const d=r[i]-p[i];s+=w[i]*d*d}return s};
  const sub=(r,b,sign)=>{const p=peqResp(b.f,b.g,b.q);for(let i=0;i<r.length;i++)r[i]-=sign*p[i]};
  const e0=wsum(r,w);
  for(let k=0;k<n;k++){
    let bi=-1,bv=0;for(let i=0;i<r.length;i++)if(w[i]>0&&Math.abs(r[i])>bv){bv=Math.abs(r[i]);bi=i}
    if(bv<1)break;
    let best=null,be=wsum(r,w);
    for(const q of QS)for(const gs of [.6,.8,1,1.2])for(let df=-2;df<=2;df++){
      const j=clamp(bi+df*2,0,GF.length-1);if(!w[j])continue;const f0=roundF(GF[j]),g=r05(clamp(r[bi]*gs,-gLim,boost));if(Math.abs(g)<1)continue;
      const e=tryB(r,f0,g,q);if(e<be){be=e;best={f:f0,g,q}}}
    if(!best||wsum(r,w)-be<e0*.01)break;
    bands.push(best);sub(r,best,1);
  }
  // 다듬기: 한 밴드씩 빼고 주변에서 다시 맞춤
  for(let pass=0;pass<2;pass++)bands.forEach(b=>{
    sub(r,b,-1);let best=b,be=tryB(r,b.f,b.g,b.q);const j0=gi(b.f);
    for(const q of QS)for(const dg of [-1.5,-1,-.5,0,.5,1,1.5])for(let df=-2;df<=2;df++){
      const jj=clamp(j0+df,0,GF.length-1);if(!w[jj]&&df)continue;const f0=roundF(GF[jj]),g=r05(clamp(b.g+dg,-gLim,boost));if(Math.abs(g)<1)continue;
      const e=tryB(r,f0,g,q);if(e<be){be=e;best={f:f0,g,q}}}
    Object.assign(b,best);sub(r,b,1)});
  return bands.sort((a,b)=>a.f-b.f)}

function fitGEQ(r,gLim,boost,maxN,w){
  const GQ=4.3,act=ISO.map(f=>w[gi(f)]>0),tgt=ISO.map(f=>at(r,f));
  const resps=g=>{const tot=new Float64Array(GF.length);g.forEach((v,k)=>{if(v){const p=peqResp(ISO[k],v,GQ);for(let i=0;i<tot.length;i++)tot[i]+=p[i]}});return tot};
  let g=tgt.map((v,k)=>act[k]?clamp(v,-gLim,boost):0);
  const iter=(keep,n)=>{for(let it=0;it<n;it++){const tot=resps(g);g=g.map((v,k)=>keep[k]?clamp(v+.6*(tgt[k]-at(tot,ISO[k])),-gLim,boost):0)}};
  iter(act,6);
  let keep=g.map(v=>Math.abs(v)>=1);
  if(keep.filter(Boolean).length>maxN){const ord=g.map((v,k)=>[Math.abs(v),k]).sort((a,b)=>b[0]-a[0]).slice(0,maxN).map(x=>x[1]);keep=g.map((v,k)=>ord.includes(k))}
  g=g.map((v,k)=>keep[k]?v:0);iter(keep,4);
  g=g.map(v=>{v=r05(v);return Math.abs(v)<1?0:v});
  return {g,resp:resps(g)}}

function eqSource(){
  if(avg)return {f:bands,db:toDb(avg),name:'지금 측정 중 (평균 '+tau+'초)'};
  if(snaps.length){const s=snaps[0];return {f:s.f,db:s.db,name:'저장된 “'+s.name+'”'}}
  return null}
function computeEQ(src){
  const C=CONS[eqc.con]||CONS.etc;
  // 측정 → 격자, 1/6옥타브 스무딩
  const lf=src.f.map(f=>Math.log2(f));
  let M=GF.map(f=>{const x=Math.log2(f);if(x<=lf[0])return src.db[0];if(x>=lf[lf.length-1])return src.db[src.db.length-1];
    let i=1;while(lf[i]<x)i++;const t=(x-lf[i-1])/(lf[i]-lf[i-1]);return src.db[i-1]*(1-t)+src.db[i]*t});
  M=M.map((_,i)=>{let s=0,c=0;for(let k=-4;k<=4;k++){const j=i+k;if(j>=0&&j<M.length){s+=M[j];c++}}return s/c});
  const fHi=12500,w=GF.map(f=>f>=eqc.lo*.94&&f<=fHi?1:0);
  const e=M.map((v,i)=>v-curveT(GF[i]));
  const mid=e.filter((v,i)=>GF[i]>=250&&GF[i]<=4000).sort((a,b)=>a-b),ref=mid[mid.length>>1];
  const dev=e.map(v=>v-ref);
  const want=dev.map((v,i)=>w[i]?clamp(-v,-12,eqc.boost):0);
  const r=Float64Array.from(want);
  const out=[];
  const st=[];
  if(eqc.mtx&&eqc.main){st.push(['mtx',eqc.mtxN,C.qmin,Math.min(2,C.qmax),'넓게 · 스피커·공간의 큰 모양']);st.push(['main',eqc.mainN,Math.max(C.qmin,1),C.qmax,'좁게 · 튀는 봉우리'])}
  else if(eqc.main)st.push(['main',eqc.mainN,C.qmin,C.qmax,'전체 모양']);
  else if(eqc.mtx)st.push(['mtx',eqc.mtxN,C.qmin,C.qmax,'전체 모양']);
  st.forEach(([k,n,ql,qh,role])=>{out.push({k,role,n,bands:fitPEQ(r,n,ql,qh,C.g,eqc.boost,w)})});
  if(eqc.geq){const gq=fitGEQ(r,C.geqG,eqc.boost,eqc.geqMax,w);for(let i=0;i<r.length;i++)r[i]-=gq.resp[i];out.push({k:'geq',role:st.length?'마무리 · 남은 잔굴곡':'전체 모양',g:gq.g})}
  const applied=want.map((v,i)=>v-r[i]);
  const after=dev.map((v,i)=>v+applied[i]);
  const rms=a=>{let s=0,c=0;a.forEach((v,i)=>{if(w[i]){s+=v*v;c++}});return Math.sqrt(s/c)};
  return {out,dev,applied,after,w,src:src.name,before:rms(dev),aft:rms(after)}}

function runEQ(force){
  if(eqLock&&!force&&eqRes)return;
  if(eqLock&&eqRes){renderEQ();return}
  const src=eqSource();eqRes=src?computeEQ(src):null;renderEQ();if(tab==='eq')drawEQ()}

const NM={main:'메인 PEQ',mtx:'매트릭스 PEQ',geq:'그래픽 EQ'};
function renderEQ(){
  const el=$('eqList'),C=CONS[eqc.con]||CONS.etc;
  $('eqCon').innerHTML='<small>콘솔</small>'+C.name;
  $('eqLock').classList.toggle('on',eqLock);$('eqLock').textContent=eqLock?'🔒 고정됨':'값 고정';
  $('eqCurve').innerHTML='<small>목표</small>'+(eqc.curve==='flat'?'평탄':'하우스');
  if(!eqc.main&&!eqc.mtx&&!eqc.geq){el.innerHTML='<div class="empty">쓸 수 있는 EQ가 하나도 체크되지 않았어요.<br>아래 <b style="color:var(--y)">콘솔</b> 버튼에서 골라 주세요.</div>';return}
  if(!eqRes){el.innerHTML='<div class="empty">핑크노이즈를 틀고 <b style="color:var(--y)">측정 시작</b>을 누르면<br>몇 초 뒤 여기에 EQ 값이 나와요.<br><br>콘솔 EQ는 먼저 <b>모두 0(플랫)</b>으로 두세요.</div>';return}
  const sg=g=>`<span class="${g<0?'cut':'boost'}">${g>0?'+':''}${g.toFixed(1)}</span>`;
  let h='';let no=0;
  eqRes.out.forEach(o=>{
    no++;
    if(o.k==='geq'){
      const on=o.g.map((g,k)=>[ISO[k],g]).filter(x=>x[1]);
      h+=`<div class="eqc"><h3><em>${no}</em>${NM.geq}<span>${o.role} · ${on.length}밴드</span></h3>`+
        (on.length?`<div class="geq">${on.map(([f,g])=>`<div><span>${fTxt(f)}</span>${sg(g)}</div>`).join('')}</div><div class="eqnote" style="padding:6px 0 0">나머지 밴드는 0 dB</div>`:`<div class="eqnote">손댈 곳 없음 — 모두 0 dB</div>`)+`</div>`;
      return}
    const rows=[];for(let i=0;i<o.n;i++){const b=o.bands[i];
      rows.push(b?`<tr><td>${i+1}</td><td>${b.q}<small>${octOf(b.q).toFixed(2)} oct</small></td><td>${fTxt(b.f)}<small>Hz</small></td><td>${sg(b.g)}<small>dB</small></td></tr>`:`<tr class="off"><td>${i+1}</td><td colspan="3">사용 안 함 (0 dB)</td></tr>`)}
    h+=`<div class="eqc"><h3><em>${no}</em>${NM[o.k]}<span>${o.role}</span></h3><table class="peq"><tr><th>#</th><th>Q</th><th>FREQ</th><th>GAIN</th></tr>${rows.join('')}</table></div>`;
  });
  h+=`<div class="eqnote">기준: ${eqRes.src} · 평탄도 <b>±${eqRes.before.toFixed(1)} dB → ±${eqRes.aft.toFixed(1)} dB</b> (예상)<br>`+
    `① 콘솔 EQ를 모두 0으로 두고 측정 → ② <b>값 고정</b> → ③ 위 순서대로 입력 → ④ 고정 풀고 다시 재서 확인.<br>`+
    `보정 범위 ${fTxt(eqc.lo)}Hz ~ 12.5kHz · 부스트는 최대 +${eqc.boost} dB까지만 (주로 깎아서 맞춰요).</div>`;
  el.innerHTML=h;
}
const cv3=$('cv3'),g3=cv3.getContext('2d');
function drawEQ(){
  const [Wd,H]=fit(cv3,g3);
  const top=22,bot=18,L=30,R=8,h=H-top-bot,w=Wd-L-R;
  const X=f=>L+Math.log2(f/20)/Math.log2(1000)*w,span=12,Y=v=>top+(1-(clamp(v,-span,span)+span)/(2*span))*h;
  g3.font='500 10px "JetBrains Mono",Menlo,monospace';g3.lineWidth=1;
  if(eqRes){const x0=X(eqc.lo*.94),x1=X(12500);g3.fillStyle='rgba(255,255,255,.03)';g3.fillRect(x0,top,x1-x0,h)}
  g3.textAlign='right';g3.textBaseline='middle';
  for(let v=-12;v<=12;v+=6){const y=Math.round(Y(v))+.5;g3.strokeStyle=v?COL.line:COL.dim;g3.beginPath();g3.moveTo(L,y);g3.lineTo(Wd-R,y);g3.stroke();g3.fillStyle=COL.dim;g3.fillText((v>0?'+':'')+v,L-4,y)}
  g3.textAlign='center';g3.textBaseline='top';
  LBL.concat([[20,'20']]).forEach(([f,t])=>{if(f<20)return;const x=Math.round(X(f))+.5;g3.fillStyle=COL.dim;g3.fillText(t,x,H-bot+4)});
  if(!eqRes)return;
  const line=(a,c,lw,dash,mask)=>{g3.strokeStyle=c;g3.lineWidth=lw;g3.setLineDash(dash||[]);g3.beginPath();let on=false;
    GF.forEach((f,i)=>{if(mask&&!eqRes.w[i]){on=false;return}const x=X(f),y=Y(a[i]);on?g3.lineTo(x,y):g3.moveTo(x,y);on=true});g3.stroke();g3.setLineDash([])};
  g3.globalAlpha=.55;line(eqRes.dev,COL.text,1.5);g3.globalAlpha=1;
  line(eqRes.applied,COL.y,2.5);
  line(eqRes.after,css('--ok'),2,[4,3],true);
  g3.font='600 10px "JetBrains Mono",Menlo,monospace';g3.textAlign='left';g3.textBaseline='middle';
  let lx=L+4;const ly=10;
  [[COL.text,'지금'],[COL.y,'EQ'],[css('--ok'),'보정 후']].forEach(([c,t])=>{g3.fillStyle=c;g3.fillRect(lx,ly-1,12,2.5);lx+=16;g3.fillStyle=COL.dim;g3.fillText(t,lx,ly);lx+=g3.measureText(t).width+12});
  if(eqLock){g3.fillStyle=COL.hi;g3.textAlign='right';g3.fillText('🔒 고정',Wd-R-2,ly)}
}

// EQ 설정 시트
function renderEqSheet(){
  const C=CONS[eqc.con]||CONS.etc;
  $('conPick').innerHTML=Object.entries(CONS).map(([k,c])=>`<button class="chip${k===eqc.con?' on':''}" data-con="${k}">${c.name}</button>`).join('');
  const tg=(id,on,t,sub)=>`<div class="row"><div class="lb"><b>${t}</b><span>${sub}</span></div><button class="tgl${on?' on':''}" data-tg="${id}" aria-label="${t}"></button></div>`;
  const stp=(id,v,t,sub,dis)=>`<div class="row sub${dis?' dis':''}"><div class="lb"><b style="font-size:13px">${t}</b><span>${sub}</span></div><div class="step"><button data-st="${id}" data-d="-1">−</button><output>${v}</output><button data-st="${id}" data-d="1">+</button></div></div>`;
  $('eqRows').innerHTML=
    tg('main',eqc.main,'메인 PEQ','메인 출력의 파라메트릭 EQ')+stp('mainN',eqc.mainN,'밴드 수','',!eqc.main)+
    tg('mtx',eqc.mtx,'매트릭스 PEQ','메인을 매트릭스로 보내서 거기 EQ도 쓸 수 있을 때')+stp('mtxN',eqc.mtxN,'밴드 수','',!eqc.mtx)+
    tg('geq',eqc.geq,'그래픽 EQ','31밴드 GEQ (주파수 · 게인만)')+stp('geqMax',eqc.geqMax,'최대 움직일 밴드','TF Flex15 = 15, 일반 = 31',!eqc.geq)+
    stp('boost',eqc.boost,'최대 부스트 (dB)','0이면 깎기만 해요').replace('row sub','row')+
    `<div class="row"><div class="lb"><b>보정 시작 주파수</b><span>아이폰 사파리는 125Hz 아래가 약해서 기본 125</span></div><div class="opts">${[63,125,250].map(v=>`<button class="chip${eqc.lo===v?' on':''}" data-lo="${v}">${v}</button>`).join('')}</div></div>`;
  $('conNote').textContent=C.note+' (밴드 수·한계는 대략 기본값이라 내 콘솔과 다르면 바꿔 주세요.)';
}
$('eqSheet').onclick=e=>{
  if(e.target===$('eqSheet')){$('eqSheet').hidden=true;return}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.con){const C=CONS[b.dataset.con];eqc.con=b.dataset.con;eqc.mainN=C.n;eqc.mtxN=C.n;eqc.mtx=C.mtx;eqc.geqMax=C.geqMax}
  else if(b.dataset.tg){eqc[b.dataset.tg]=!eqc[b.dataset.tg]}
  else if(b.dataset.st){const k=b.dataset.st,d=+b.dataset.d,lim={mainN:[1,8],mtxN:[1,8],geqMax:[1,31],boost:[0,6]}[k];eqc[k]=clamp(eqc[k]+d,lim[0],lim[1])}
  else if(b.dataset.lo){eqc.lo=+b.dataset.lo}
  else return;
  saveEqc();renderEqSheet();runEQ(true);
};
$('eqCon').onclick=()=>{renderEqSheet();$('eqSheet').hidden=false};
$('eqClose').onclick=()=>{$('eqSheet').hidden=true};
$('eqLock').onclick=()=>{eqLock=!eqLock;if(!eqLock)runEQ(true);else{renderEQ();drawEQ()}};
$('eqCurve').onclick=()=>{eqc.curve=eqc.curve==='flat'?'house':'flat';saveEqc();runEQ(true)};
$('eqAgain').onclick=()=>{const l=eqLock;eqLock=false;runEQ(true);eqLock=l;renderEQ()};
addEventListener('orientationchange',()=>setTimeout(draw,300));

paintStatic();renderEQ();draw();
</script>
</body>
